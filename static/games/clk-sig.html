<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="utf-8" />
  <title>سیگنال کلاک</title>
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.4.2/p5.min.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;600&display=swap" rel="stylesheet">
  <style>
    html, body { height: 100%; }
    body {
      margin: 0;
      display: grid;
      place-items: center;
      background: #fff;
      font-family: Vazirmatn, system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }
    .frame { width: min(95vw, 1200px); }
    canvas { display: block; }
  </style>
</head>
<body>
  <div class="frame" id="wrap"></div>

  <script>
    let periodSec = 4.0;   // starts at 4 s
    let pxPerSec  = 40;    // scroll speed
    let yHigh, yLow, x0, x1;
    let labelSize = 14, infoSize = 22, titleSize = 26;

    function desiredSize() {
      const w = Math.min(windowWidth * 0.95, 1200);
      const h = Math.min(350, Math.max(180, windowHeight * 0.35));
      return { w: Math.floor(w), h: Math.floor(h) };
    }

    function setup() {
      const { w, h } = desiredSize();
      const c = createCanvas(w, h);
      c.parent('wrap');
      textFont('Vazirmatn');
      strokeCap(SQUARE);
      layout();
    }

    function windowResized() {
      const { w, h } = desiredSize();
      resizeCanvas(w, h);
      layout();
    }

    function layout() {
      const m = 40;
      x0 = m; x1 = width - m;
      // rails closer
      yHigh = Math.round(height * 0.38);
      yLow  = Math.round(height * 0.70);
      // scale text
      const s = constrain(height / 220, 0.8, 1.6);
      labelSize = Math.round(13 * s);
      infoSize  = Math.round(24 * s);
      titleSize = Math.round(26 * s);
    }

    function draw() {
      background(255);

      // title (top center)
      noStroke(); fill(0);
      textAlign(CENTER, BASELINE);
      textSize(titleSize);
      text('سیگنال کلاک', width/2, 30);

      // period and frequency (centered under title)
      const hz = 1 / periodSec;
      textSize(infoSize);
    //   text(`طول دوره = ${nf(periodSec, 1, 2)} ثانیه    فرکانس = ${nf(hz, 1, 2)} Hz`, width/2, 38 + infoSize + 6);

      // small labels
      textAlign(LEFT, BASELINE);
      textSize(labelSize);
      text('1',  20, yHigh + 4);
      text('0',  20, yLow  + 4);

      // rails
      stroke(180); strokeWeight(1);
      line(x0, yHigh, x1, yHigh);
      line(x0, yLow,  x1, yLow);

      // waveform
      stroke(0, 105, 255);
      strokeWeight(3); noFill();
      beginShape();
      for (let x = x0; x <= x1; x++) {
        const t = millis()/1000 - (x1 - x)/pxPerSec;
        let phase = (t / periodSec) % 1; if (phase < 0) phase += 1;
        const y = (phase < 0.5) ? yHigh : yLow;
        vertex(x, y);
      }
      endShape();
    }

    // arrows still work; not shown on canvas
    function keyPressed() {
      if (keyCode === RIGHT_ARROW) periodSec = max(0.25, periodSec / 2);
      if (keyCode === LEFT_ARROW)  periodSec = min(16.0, periodSec * 2);
    }
  </script>
</body>
</html>
