<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>NOT Gate Mini-Game</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.4.2/p5.min.js"></script>
  <style>
    @font-face {
      font-family: 'Vazir';
      src: url('https://cdn.fontcdn.ir/Font/Persian/Vazir/Vazir.woff') format('woff');
      font-display: swap;
    }
    :root{
      --box-w: 320px;
      --box-h: 450px;
      --radius: 14px;
      --shadow: 0 2px 10px rgba(0,0,0,0.12);
    }
    /* Layout */
    html,body{height:100%}
    body{
      margin:0;
      background:#fff;
      font-family: Vazir, system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif;
      display:flex;
      align-items:center;
      justify-content:center;
      padding:16px;
    }
    .wrap{
      display:flex;
      flex-direction:column;
      gap:16px;
      width:100%;
      max-width:1100px;
      align-items:center;
      justify-content:center;
    }
    @media (min-width:768px){
      .wrap{ flex-direction:row; }
    }
    /* Boxes */
    .box{
      flex:1 1 0;
      display:flex;
      align-items:center;
      justify-content:center;
      min-width:340px; /* keeps parity on desktop */
    }
    .card{
      width:var(--box-w);
      height:var(--box-h);
      background:#fff;
      border-radius:var(--radius);
      box-shadow:var(--shadow);
      display:flex;
      flex-direction:column;
      overflow:hidden;
    }
    .card-head{
      padding:10px 14px;
      text-align:center;
      font-size:20px;
      border-bottom:1px solid #eee;
    }
    .card-body{
      flex:1;
      display:flex;
      align-items:center;
      justify-content:center;
      padding:10px;
    }
    /* Schematic content */
    .schematic-inner{
      width:100%;
      height:100%;
      display:flex;
      flex-direction:column;
      align-items:center;
      justify-content:center;
      gap:16px;
    }
    .schematic-img{
      width:240px;
      height:auto;
      display:block;
    }
    /* p5 canvas styling parity */
    canvas{
      display:block;
      border-radius:0; /* canvas sits inside card */
      width:var(--box-w);
      height:var(--box-h);
    }
  </style>
</head>
<body>
  <div class="wrap">
    <!-- Schematic box (DOM image, no p5 loadImage) -->
    <div class="box">
      <div class="card">
        <div class="card-head">شماتیک گیت NOT</div>
        <div class="card-body">
          <div class="schematic-inner">
            <img class="schematic-img" src="not-gate.svg" alt="NOT Gate"/>
          </div>
        </div>
      </div>
    </div>

    <!-- Truth table box -->
    <div class="box">
      <div class="card">
        <div class="card-head">جدول درستی</div>
        <div class="card-body">
          <div id="truth-table"></div>
        </div>
      </div>
    </div>

    <!-- Circuit box -->
    <div class="box">
      <div class="card">
        <div class="card-head">مدار تعاملی</div>
        <div class="card-body">
          <div id="circuit"></div>
        </div>
      </div>
    </div>
  </div>

<script>
/* shared state */
let switchState = 0;
let table = [
  { input: Math.floor(Math.random() * 2), output: Math.floor(Math.random() * 2) },
  { input: Math.floor(Math.random() * 2), output: Math.floor(Math.random() * 2) }
];
let results = [false, false];
let checkButtonColor;

/* Truth table sketch */
(function setupTruthTable(){
  const sketch = function(p){
    p.setup = function(){
      p.createCanvas(320, 450);
      p.textAlign(p.CENTER, p.CENTER);
      p.textSize(16);
      p.textFont('Vazir');
      checkButtonColor = p.color(200, 200, 200);
    };

    p.draw = function(){
      p.clear();
      p.background(255);

      const startX = 100;
      const startY = 120;

      p.textSize(18);
      p.fill(0);
      p.text("ورودی", startX, startY - 30);
      p.text("خروجی", startX + 80, startY - 30);
      p.text("نتیجه", startX + 160, startY - 30);

      for (let i = 0; i < table.length; i++) {
        // input cell
        p.fill(table[i].input ? p.color(50, 205, 50) : p.color(255, 99, 71));
        p.rect(startX - 20, startY + i * 60, 40, 40, 10);
        p.fill(255);
        p.textSize(16);
        p.text(table[i].input, startX, startY + i * 60 + 20);

        // output cell
        p.fill(table[i].output ? p.color(50, 205, 50) : p.color(255, 99, 71));
        p.rect(startX + 60, startY + i * 60, 40, 40, 10);
        p.fill(255);
        p.text(table[i].output, startX + 80, startY + i * 60 + 20);

        // result cell
        p.textSize(22);
        p.fill(results[i] ? p.color(50, 205, 50) : p.color(255, 99, 71));
        p.text(results[i] ? "✅" : "❌", startX + 160, startY + i * 60 + 20);
      }

      // check button
      p.fill(checkButtonColor);
      p.rect(startX + 1, 290, 120, 50, 15);
      p.fill(255);
      p.textSize(18);
      p.text("بررسی", startX + 60, 315);
    };

    p.mousePressed = function(){
      const startX = 100;
      const startY = 120;

      for (let i = 0; i < table.length; i++) {
        if (p.mouseX > startX - 20 && p.mouseX < startX + 20 &&
            p.mouseY > startY + i * 60 && p.mouseY < startY + i * 60 + 40) {
          table[i].input = 1 - table[i].input;
        }
        if (p.mouseX > startX + 60 && p.mouseX < startX + 100 &&
            p.mouseY > startY + i * 60 && p.mouseY < startY + i * 60 + 40) {
          table[i].output = 1 - table[i].output;
        }
      }

      if (p.mouseX > startX + 20 && p.mouseX < startX + 140 &&
          p.mouseY > 290 && p.mouseY < 340) {
        const r1 = [table[0].input, table[0].output];
        const r2 = [table[1].input, table[1].output];
        const isValid =
          (r1[0] === 0 && r1[1] === 1 && r2[0] === 1 && r2[1] === 0) ||
          (r1[0] === 1 && r1[1] === 0 && r2[0] === 0 && r2[1] === 1);

        results[0] = (r1[0] ^ r1[1]) === 1;
        results[1] = (r2[0] ^ r2[1]) === 1;

        checkButtonColor = isValid ? p.color(50, 205, 50) : p.color(255, 99, 71);
      }
    };
  };
  new p5(sketch, 'truth-table');
})();

/* Circuit sketch */
(function setupCircuit(){
  const sketch = function(p){
    let switchOn = false;

    p.setup = function(){
      p.createCanvas(320, 450);
      p.textAlign(p.CENTER, p.CENTER);
      p.textSize(16);
      p.textFont('Vazir');
    };

    p.draw = function(){
      p.clear();
      p.background(255);

      drawCircuit();
    };

    function drawCircuit(){
      const centerX = 160;
      const centerY = 225;
      const w = 150;
      const h = 90;

      // wires
      p.stroke(0); p.strokeWeight(3); p.noFill();
      p.line(centerX - w/2, centerY - h/2, centerX + w/2, centerY - h/2);           // top
      p.line(centerX + w/2, centerY - h/2, centerX + w/2, centerY + h/2);           // right
      p.line(centerX + w/2, centerY + h/2, centerX + 15, centerY + h/2);            // bottom right
      p.line(centerX - 15, centerY + h/2, centerX - w/2, centerY + h/2);            // bottom left
      p.line(centerX - w/2, centerY + h/2, centerX - w/2, centerY - h/2);           // left

      drawBattery(centerX - w/2, centerY);
      drawResistor(centerX, centerY - h/2);
      drawBulb(centerX + w/2, centerY);
      drawSwitch(centerX, centerY + h/2);
    }

    function drawBattery(x, y){
      p.push(); p.translate(x, y);
      p.stroke(0); p.strokeWeight(4); p.line(-15, 0, 15, 0);
      p.strokeWeight(3); p.line(-10, 8, 10, 8);
      p.noStroke(); p.fill(0); p.textSize(10); p.text('باتری', -30, 3);
      p.pop();
    }

    function drawResistor(x, y){
      p.push(); p.translate(x, y);
      p.stroke(0); p.strokeWeight(3); p.noFill();
      p.beginShape();
      p.vertex(-22, 0); p.vertex(-15, 0);
      p.vertex(-11, -8); p.vertex(-4, 8);
      p.vertex(4, -8); p.vertex(11, 8);
      p.vertex(15, 0); p.vertex(22, 0);
      p.endShape();
      p.noStroke(); p.fill(0); p.textSize(10); p.text('مقاومت', 0, 20); p.text('R', 0, -15);
      p.pop();
    }

    function drawBulb(x, y){
      p.push(); p.translate(x, y);
      p.stroke(0); p.strokeWeight(2);
      p.fill(switchOn ? p.color(255,255,0) : 255);
      p.ellipse(0, 0, 30, 30);
      p.stroke(switchOn ? p.color(255,150,0) : 0); p.strokeWeight(switchOn ? 2 : 1);
      p.line(-6,-6,6,6); p.line(-6,6,6,-6);
      p.noStroke(); p.fill(0); p.textSize(10); p.text('لامپ', 20, 0);
      p.pop();
    }

    function drawSwitch(x, y){
      p.push(); p.translate(x, y);
      p.stroke(0); p.strokeWeight(3); p.fill(0);
      p.ellipse(-15, 0, 5, 5); p.ellipse(15, 0, 5, 5);

      if (switchOn) {
        p.stroke(0,150,0); p.strokeWeight(4); p.line(-15, 0, 15, 0);
      } else {
        p.stroke(255,0,0); p.strokeWeight(3); p.line(-15, 0, 10, -12);
      }

      p.noStroke(); p.fill(0); p.textSize(10); p.text('سویچ', 0, 20);
      p.text(switchOn ? 'بسته' : 'باز', 0, 32);
      p.pop();
    }

    p.mousePressed = function(){
      const switchX = 160;
      const switchY = 225 + 45;
      const d = p.dist(p.mouseX, p.mouseY, switchX, switchY);
      if (d < 20) {
        switchOn = !switchOn;
        switchState = switchOn ? 1 : 0;
      }
    };
  };
  new p5(sketch, 'circuit');
})();
</script>
</body>
</html>
