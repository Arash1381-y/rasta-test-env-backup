<!DOCTYPE html>
<html lang="fa">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>AND Gate Mini-Game</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.4.2/p5.min.js"></script>
  <style>
    @font-face {
      font-family: 'Vazir';
      src: url('https://cdn.fontcdn.ir/Font/Persian/Vazir/Vazir.woff') format('woff');
      font-display: swap;
    }
    :root{
      --box-w: 320px;
      --box-h: 450px;
      --radius: 14px;
      --shadow: 0 2px 10px rgba(0,0,0,0.12);
    }
    html,body{height:100%}
    body{
      margin:0;
      background:#fff;
      font-family: Vazir, system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif;
      display:flex;
      align-items:center;
      justify-content:center;
      padding:16px;
      direction: rtl;
    }
    .wrap{
      display:flex;
      flex-direction:column;
      gap:16px;
      width:100%;
      max-width:1100px;
      align-items:center;
      justify-content:center;
    }
    @media (min-width:768px){
      .wrap{ flex-direction:row; }
    }
    .box{
      flex:1 1 0;
      display:flex;
      align-items:center;
      justify-content:center;
      min-width:340px;
    }
    .card{
      width:var(--box-w);
      height:var(--box-h);
      background:#fff;
      border-radius:var(--radius);
      box-shadow:var(--shadow);
      display:flex;
      flex-direction:column;
      overflow:hidden;
    }
    .card-head{
      padding:10px 14px;
      text-align:center;
      font-size:20px;
      border-bottom:1px solid #eee;
    }
    .card-body{
      flex:1;
      display:flex;
      align-items:center;
      justify-content:center;
      padding:10px;
    }
    .schematic-inner{
      width:100%;
      height:100%;
      display:flex;
      flex-direction:column;
      align-items:center;
      justify-content:center;
      gap:16px;
    }
    .schematic-img{
      width:240px;
      height:auto;
      display:block;
    }
    canvas{
      display:block;
      border-radius:0;
      width:var(--box-w);
      height:var(--box-h);
    }
  </style>
</head>
<body>
  <div class="wrap" dir="rtl">

    <!-- Schematic -->
    <div class="box">
      <div class="card">
        <div class="card-head">شماتیک گیت AND</div>
        <div class="card-body">
          <div class="schematic-inner">
              <img class="schematic-img" src="AND.png" alt="AND Gate">
          </div>
        </div>
      </div>
    </div>

    <!-- Circuit -->
    <div class="box">
      <div class="card">
        <div class="card-head">مدار تعاملی</div>
        <div class="card-body">
          <div id="circuit"></div>
        </div>
      </div>
    </div>



    <!-- Truth table -->
    <div class="box">
      <div class="card">
        <div class="card-head">جدول درستی گیت AND</div>
        <div class="card-body">
          <div id="truth-table"></div>
        </div>
      </div>
    </div>

  </div>

<script>
let switchState = 0;
let table = [
  { input1: 0, input2: 0, output: 1 },
  { input1: 0, input2: 1, output: 1 },
  { input1: 0, input2: 1, output: 1 },
  { input1: 1, input2: 1, output: 1 }
];
let results = [false, false, false, false];
let checkButtonColor;

/* Truth table sketch */
(function setupTruthTable(){
  const sketch = function(p){
    p.setup = function(){
      p.createCanvas(320, 450);
      p.textAlign(p.CENTER, p.CENTER);
      p.textSize(16);
      p.textFont('Vazir');
      checkButtonColor = p.color(200, 200, 200);
    };

    p.draw = function(){
      p.clear();
      p.background(255);

      const startX = 80;
      const startY = 110;

      p.textSize(18);
      p.fill(0);
      p.text("ورودی ۱", startX - 25, startY - 20);
      p.text("ورودی ۲", startX + 40, startY - 20);
      p.text("خروجی",   startX + 100, startY - 20);
      p.text("نتیجه",   startX + 170, startY - 20);

      for (let i = 0; i < table.length; i++) {
        p.fill(table[i].input1 ? p.color(50,205,50) : p.color(255,99,71));
        p.rect(startX - 40, startY + i * 60, 40, 40, 10);
        p.fill(255); p.textSize(16);
        p.text(table[i].input1, startX - 20, startY + i * 60 + 20);

        p.fill(table[i].input2 ? p.color(50,205,50) : p.color(255,99,71));
        p.rect(startX + 20, startY + i * 60, 40, 40, 10);
        p.fill(255);
        p.text(table[i].input2, startX + 40, startY + i * 60 + 20);

        p.fill(table[i].output ? p.color(50,205,50) : p.color(255,99,71));
        p.rect(startX + 80, startY + i * 60, 40, 40, 10);
        p.fill(255);
        p.text(table[i].output, startX + 100, startY + i * 60 + 20);

        p.fill(results[i] ? p.color(50,205,50) : p.color(255,99,71));
        p.textSize(20);
        p.text(results[i] ? "✅" : "❌", startX + 160, startY + i * 60 + 20);
      }

      p.fill(checkButtonColor);
      p.rect(startX + 20, 340, 120, 50, 15);
      p.fill(255);
      p.textSize(18);
      p.text("بررسی", startX + 80, 365);
    };

    p.mousePressed = function(){
      const startX = 80;
      const startY = 110;

      for (let i = 0; i < table.length; i++) {
        if (p.mouseX > startX - 40 && p.mouseX < startX &&
            p.mouseY > startY + i * 60 && p.mouseY < startY + i * 60 + 40) {
          table[i].input1 = 1 - table[i].input1;
        }
        if (p.mouseX > startX + 20 && p.mouseX < startX + 60 &&
            p.mouseY > startY + i * 60 && p.mouseY < startY + i * 60 + 40) {
          table[i].input2 = 1 - table[i].input2;
        }
        if (p.mouseX > startX + 80 && p.mouseX < startX + 120 &&
            p.mouseY > startY + i * 60 && p.mouseY < startY + i * 60 + 40) {
          table[i].output = 1 - table[i].output;
        }
      }

      if (p.mouseX > startX + 20 && p.mouseX < startX + 140 &&
          p.mouseY > 340 && p.mouseY < 390) {
        for (let i = 0; i < table.length; i++) {
          const expected = (table[i].input1 === 1 && table[i].input2 === 1) ? 1 : 0;
          results[i] = table[i].output === expected;
        }
        const isValid = results.every(r => r);
        checkButtonColor = isValid ? p.color(50,205,50) : p.color(255,99,71);
      }
    };
  };
  new p5(sketch, 'truth-table');
})();

/* Circuit sketch */
(function setupCircuit(){
  const sketch = function(p){
    let switch1On = false;
    let switch2On = false;

    p.setup = function(){
      p.createCanvas(320, 450);
      p.textAlign(p.CENTER, p.CENTER);
      p.textSize(16);
      p.textFont('Vazir');
    };

    p.draw = function(){
      p.clear();
      p.background(255);
      drawCircuit();
    };

    function drawCircuit(){
      const centerX = 160;
      const centerY = 225;
      const w = 150;
      const h = 90;

      p.stroke(0); p.strokeWeight(3); p.noFill();
      p.line(centerX - w/2, centerY - h/2, centerX + w/2, centerY - h/2);       // top
      p.line(centerX + w/2, centerY - h/2, centerX + w/2, centerY + h/2);       // right
      p.line(centerX + w/2, centerY + h/2, centerX + 45, centerY + h/2);        // bottom right
      p.line(centerX + 15, centerY + h/2, centerX - 15, centerY + h/2);         // gap for switches
      p.line(centerX - 45, centerY + h/2, centerX - w/2, centerY + h/2);        // bottom left
      p.line(centerX - w/2, centerY + h/2, centerX - w/2, centerY - h/2);       // left

      drawBattery(centerX - w/2, centerY);
      drawResistor(centerX, centerY - h/2);
      drawBulb(centerX + w/2, centerY);
      drawSwitch(centerX - 30, centerY + h/2, switch1On, 1);
      drawSwitch(centerX + 30, centerY + h/2, switch2On, 2);
    }

    function drawBattery(x, y){
      p.push(); p.translate(x, y);
      p.stroke(0); p.strokeWeight(4); p.line(-15, 0, 15, 0);
      p.strokeWeight(3); p.line(-10, 8, 10, 8);
      p.noStroke(); p.fill(0); p.textSize(10); p.text('باتری', -30, 3);
      p.pop();
    }

    function drawResistor(x, y){
      p.push(); p.translate(x, y);
      p.stroke(0); p.strokeWeight(3); p.noFill();
      p.beginShape();
      p.vertex(-22, 0); p.vertex(-15, 0);
      p.vertex(-11, -8); p.vertex(-4, 8);
      p.vertex(4, -8); p.vertex(11, 8);
      p.vertex(15, 0); p.vertex(22, 0);
      p.endShape();
      p.noStroke(); p.fill(0); p.textSize(10); p.text('مقاومت', 0, 20); p.text('R', 0, -15);
      p.pop();
    }

    function drawBulb(x, y){
      const on = switch1On && switch2On;
      p.push(); p.translate(x, y);
      p.stroke(0); p.strokeWeight(2);
      p.fill(on ? p.color(255,255,0) : 255);
      p.ellipse(0, 0, 30, 30);
      p.stroke(on ? p.color(255,150,0) : 0); p.strokeWeight(on ? 2 : 1);
      p.line(-6,-6,6,6); p.line(-6,6,6,-6);
      p.noStroke(); p.fill(0); p.textSize(10); p.text('لامپ', 28, 0);
      p.pop();
    }

    function drawSwitch(x, y, isOn, num){
      p.push(); p.translate(x, y);
      p.stroke(0); p.strokeWeight(3); p.fill(0);
      p.ellipse(-15, 0, 5, 5); p.ellipse(15, 0, 5, 5);
      if (isOn) { p.stroke(0,150,0); p.strokeWeight(4); p.line(-15, 0, 15, 0); }
      else { p.stroke(255,0,0); p.strokeWeight(3); p.line(-15, 0, 10, -12); }
      p.noStroke(); p.fill(0); p.textSize(10); p.text(`سوئیچ ${num}`, 0, 20); p.text(isOn ? 'بسته' : 'باز', 0, 32);
      p.pop();
    }

    p.mousePressed = function(){
      const switch1X = 160 - 30;
      const switch2X = 160 + 30;
      const switchY  = 225 + 45;
      const d1 = p.dist(p.mouseX, p.mouseY, switch1X, switchY);
      const d2 = p.dist(p.mouseX, p.mouseY, switch2X, switchY);

      if (d1 < 20) switch1On = !switch1On;
      if (d2 < 20) switch2On = !switch2On;

      switchState = (switch1On && switch2On) ? 1 : 0;
    };
  };
  new p5(sketch, 'circuit');
})();
</script>
</body>
</html>
