<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="utf-8" />
  <title>سیگنال کلاک — نقاط نشان‌دار</title>
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.4.2/p5.min.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;600&display=swap" rel="stylesheet">
  <style>
    html, body { height: 100%; }
    body {
      margin: 0; display: grid; place-items: center; background: #fff;
      font-family: Vazirmatn, system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }
    .frame { width: min(95vw, 1200px); }
    canvas { display:block; }
  </style>
</head>
<body>
  <div class="frame" id="wrap"></div>

  <script>
    let periodSec = 4.0;   // ثابت
    let x0, x1, yHigh, yLow;
    let titleSize = 26, labelSize = 14;

    function desiredSize() {
      const w = Math.min(windowWidth * 0.95, 1200);
      const h = Math.min(350, Math.max(180, windowHeight * 0.35));
      return { w: Math.floor(w), h: Math.floor(h) };
    }

    function setup() {
      const { w, h } = desiredSize();
      const c = createCanvas(w, h);
      c.parent('wrap');
      textFont('Vazirmatn');
      strokeCap(SQUARE);
      layout();
      noLoop(); // موج ثابت
    }

    function windowResized() {
      const { w, h } = desiredSize();
      resizeCanvas(w, h);
      layout();
      redraw();
    }

    function layout() {
      const m = 40;
      x0 = m; x1 = width - m;
      // همان Y ها مثل بازی مرجع
      yHigh = Math.round(height * 0.38);
      yLow  = Math.round(height * 0.70);

      const s = constrain(height / 220, 0.8, 1.6);
      titleSize = Math.round(26 * s);
      labelSize = Math.round(13 * s);
    }

    function draw() {
      background(255);

      // عنوان
      noStroke(); fill(0);
      textAlign(CENTER, BASELINE);
      textSize(titleSize);
      text('سیگنال کلاک', width/2, 30);

      // برچسب‌های 1 و 0
      textAlign(LEFT, BASELINE);
      textSize(labelSize);
      text('1', 20, yHigh + 4);
      text('0', 20, yLow  + 4);

      // ریل‌ها
      stroke(180); strokeWeight(1);
      line(x0, yHigh, x1, yHigh);
      line(x0, yLow,  x1, yLow);

      // موج کلاک ثابت: چند دوره در نما
      const span = Math.max(3 * periodSec, 6); // ثانیه نمایش
      const tStart = 0, tEnd = tStart + span;

      stroke(0,105,255); strokeWeight(3); noFill();
      beginShape();
      for (let x = x0; x <= x1; x++) {
        const t = map(x, x0, x1, tStart, tEnd);
        const frac = (t / periodSec) % 1;
        const y = (frac < 0.5) ? yHigh : yLow;
        vertex(x, y);
      }
      endShape();

      // دو نقطه در همان یک دوره: یکی نزدیک لبه (شروع نیم‌دوره‌ی بالا)، یکی وسط نیم‌دوره‌ی بالا
      const T = periodSec;
      const tEdge = 0.05 * T;   // نزدیک لبه‌ی بالا رفتن
      const tMid  = 0.25 * T;   // وسط نیم‌دوره‌ی بالا

      const xEdge = map(tEdge, tStart, tEnd, x0, x1);
      const xMid  = map(tMid,  tStart, tEnd, x0, x1);

      // پیکان‌ها با خط ضخیم‌تر
      const arrowW = 5;   // افزایش ضخامت
      const headSz = 10;

      drawVerticalArrow(xEdge, yHigh - 30, yHigh, headSz, color(0,160,80), arrowW);  // سبز
      drawMarker(xEdge, yHigh, color(0,160,80));

      drawVerticalArrow(xMid,  yHigh - 30, yHigh, headSz, color(200,40,40), arrowW); // قرمز
      drawMarker(xMid,  yHigh, color(200,40,40));
    }

    function drawVerticalArrow(x, yTop, yTip, headSize, col, weight) {
      stroke(col); strokeWeight(weight);
      line(x, yTop, x, yTip);
      line(x, yTip, x - headSize, yTip - headSize);
      line(x, yTip, x + headSize, yTip - headSize);
    }

    function drawMarker(x, y, col) {
      noStroke(); fill(col);
      circle(x, y, 7);
    }
  </script>
</body>
</html>
