<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>انتخاب رنگ RGB</title>
<style>
  :root { --thumb: 24px; --track:#e5e7eb; }
*{ box-sizing:border-box }
body{ margin:0; font-family:system-ui,sans-serif }
.wrap{ max-width:600px; margin:8px auto; padding:0 8px }
.swatch{ font-size:12px; width:min(260px, 100%); aspect-ratio:2/1.3; margin:8px auto; border:1px solid #e5e7eb; border-radius:12px; display:grid; place-items:center }
.rows{ display:grid; gap:10px; width:min(260px, 100%); margin:0 auto }
.row{ display:grid; gap:4px }
.label{ display:flex; justify-content:space-between; font-size:12px }

input[type="range"]{
  width:100%; height:var(--thumb);
  -webkit-appearance:none; appearance:none;
  background:transparent; outline:none; direction:ltr;
  --pct:0%;
  color:#9ca3af;
  accent-color: currentColor;
}
input[type="range"]::-webkit-slider-runnable-track{
  height:4px; border-radius:999px;
  background: linear-gradient(to right,
    currentColor 0%,
    currentColor var(--pct),
    var(--track)  var(--pct),
    var(--track)  100%
  );
}
input[type="range"]::-moz-range-track{
  height:4px; border-radius:999px; background:var(--track);
}
input[type="range"]::-moz-range-progress{
  height:4px; border-radius:999px; background:currentColor;
}
input[type="range"]::-webkit-slider-thumb{
  -webkit-appearance:none; width:var(--thumb); height:var(--thumb);
  border-radius:50%; border:0; background:currentColor;
  margin-top: calc((var(--thumb) - 4px)/-2);
}
input[type="range"]::-moz-range-thumb{
  width:var(--thumb); height:var(--thumb); border-radius:50%; border:0; background:currentColor;
}

#r{ color:#ef4444 }
#g{ color:#22c55e }
#b{ color:#3b82f6 }
</style>
</head>
<body>
<div class="wrap">
  <div id="swatch" class="swatch">
    <div>R:<span  id="rv">128</span>&nbsp; G:<span id="gv">128</span>&nbsp; B:<span id="bv">128</span></div>
  </div>

  <div class="rows">
    <div class="row">
      <div class="label"><span id="rlabel">128</span></div>
      <input id="r" type="range" min="0" max="255" value="128">
    </div>
    <div class="row">
      <div class="label"><span id="glabel">128</span></div>
      <input id="g" type="range" min="0" max="255" value="128">
    </div>
    <div class="row">
      <div class="label"><span id="blabel">128</span></div>
      <input id="b" type="range" min="0" max="255" value="128">
    </div>
  </div>
</div>

<script>
  const dom = {
    swatch: swatch,
    r: r, g: g, b: b,
    rv: rv, gv: gv, bv: bv,
    rlabel: rlabel, glabel: glabel, blabel: blabel
  };

  const clamp = n => Math.min(255, Math.max(0, Math.round(Number(n)||0)));
  const rgbString = (r,g,b) => `rgb(${clamp(r)}, ${clamp(g)}, ${clamp(b)})`;

  function setPct(el){
    const min = Number(el.min||0), max = Number(el.max||100);
    el.style.setProperty('--pct', ((el.value-min)*100)/(max-min) + '%');
  }

  function sync(r,g,b){
    r = clamp(r); g = clamp(g); b = clamp(b);
    dom.r.value=r; dom.g.value=g; dom.b.value=b;
    [dom.r,dom.g,dom.b].forEach(setPct);
    dom.rv.textContent=r; dom.gv.textContent=g; dom.bv.textContent=b;
    dom.rlabel.textContent=r; dom.glabel.textContent=g; dom.blabel.textContent=b;
    dom.swatch.style.background = rgbString(r,g,b);
  }

  [dom.r,dom.g,dom.b].forEach(el=>{
    el.addEventListener('input', ()=> sync(dom.r.value,dom.g.value,dom.b.value));
    el.addEventListener('change', ()=> setPct(el));
  });

  sync(dom.r.value, dom.g.value, dom.b.value);
</script>
</body>
</html>
